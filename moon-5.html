<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon</title>
<meta name="theme-color" content="#0f1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link id="manifest" rel="manifest">
<style>
  :root{
    --ink:        #0f1320;
    --ink-lift:   #1b2233;
    --bone:       #f2ece0;
    --bone-dim:   #ddd3c0;
    --muted:      #79839c;
    --hair:       rgba(121,131,156,.22);
    --town-back:  #080b16;
    --town-front: #020408;
    --wire:       #161c2b;
    --win:        #e0a355;

    --town-h: clamp(110px, 20vh, 190px);
    --moon-y: 0px;              /* reserved: real altitude above the roofline */

    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(var(--town-h) + 16px);
    overflow:hidden;
  }

  /* the sky wheels very slowly around the moon, like a long exposure */
  #sky{
    position:fixed;left:-25%;top:-25%;width:150%;height:150%;
    pointer-events:none;z-index:0;
  }
  .star{
    position:absolute;border-radius:50%;background:var(--bone);
    opacity:var(--o);will-change:opacity;
  }
  .star.lg{ box-shadow:0 0 4px 1px rgba(242,236,224,.30) }
  @media (prefers-reduced-motion:no-preference){
    #sky{animation:wheel 900s linear infinite}
    .star{animation:twinkle var(--dur) ease-in-out var(--delay) infinite}
  }
  @keyframes wheel{ to{ transform:rotate(360deg) } }
  @keyframes twinkle{
    0%,100%{ opacity:calc(var(--o) * .55) }
    50%    { opacity:var(--o) }
  }

  /* streetlight bleed: sits above the stars, below the buildings, and reaches
     higher than the band so tall shapes still read against a lifted sky */
  #glow{
    position:fixed;left:-10%;bottom:0;width:120%;
    height:calc(var(--town-h) * 2.2);
    z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 55% 48% at 50% 100%, rgba(235,182,112,.20), transparent 72%),
      radial-gradient(ellipse 95% 85% at 50% 100%, rgba(224,163,85,.11),  transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 100%, rgba(126,140,178,.13), transparent 75%);
  }

  /* town sits in front of the sky, so stars set behind the roofline */
  #town{
    position:fixed;left:0;right:0;bottom:0;
    height:var(--town-h);
    pointer-events:none;z-index:2;
  }
  #town svg{display:block;width:100%;height:100%}
  .win{ transition:opacity 1.2s ease }

  .date,.moon-wrap,.name,.stats,.next,.foot{position:relative;z-index:1}

  .date{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);margin-bottom:24px;
  }

  .moon-wrap{
    width:min(56vw,210px);aspect-ratio:1;
    transform:translateY(var(--moon-y));
  }
  .moon-wrap svg{display:block;width:100%;height:100%;overflow:visible}

  .name{
    font-family:var(--serif);
    font-size:clamp(25px,7vw,32px);
    font-weight:400;letter-spacing:.005em;
    margin:30px 0 0;text-align:center;line-height:1.15;
  }

  .stats{
    margin-top:11px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);text-align:center;
  }

  .next{
    margin-top:22px;padding-top:13px;
    border-top:1px solid var(--hair);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);text-align:center;min-width:180px;
  }

  .foot{margin-top:4px}
  button{
    appearance:none;background:none;border:0;
    font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);padding:9px 14px;cursor:pointer;border-radius:2px;
  }
  button:hover{color:var(--bone-dim)}
  button:focus-visible{outline:1px solid var(--muted);outline-offset:2px}

  @media (prefers-reduced-motion:no-preference){
    .fade{animation:fade .9s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
  @media (max-height:620px){
    .name{margin-top:20px}
    .next{margin-top:16px}
    .date{margin-bottom:16px}
  }
</style>
</head>
<body>

  <div id="sky" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>

  <div class="date fade" id="date"></div>

  <div class="moon-wrap fade" style="animation-delay:.05s">
    <svg viewBox="-128 -128 256 256" role="img" aria-labelledby="a11y">
      <title id="a11y">Moon phase</title>
      <defs>
        <radialGradient id="moonGlow">
          <stop offset="42%" stop-color="rgba(242,236,224,.20)"/>
          <stop offset="100%" stop-color="rgba(242,236,224,0)"/>
        </radialGradient>
        <clipPath id="litClip"><path id="clipPath" d=""/></clipPath>
      </defs>
      <circle id="halo" cx="0" cy="0" r="126" fill="url(#moonGlow)"/>
      <circle cx="0" cy="0" r="100" fill="var(--ink-lift)"/>
      <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(121,131,156,.35)" stroke-width="1"/>
      <g id="disc">
        <path id="lit" d="" fill="var(--bone)"/>
        <g clip-path="url(#litClip)" fill="#ddd2bd">
          <ellipse cx="-30" cy="-38" rx="26" ry="20" opacity=".55"/>
          <ellipse cx="14"  cy="-52" rx="17" ry="13" opacity=".42"/>
          <ellipse cx="34"  cy="-8"  rx="22" ry="27" opacity=".48"/>
          <ellipse cx="-46" cy="18"  rx="19" ry="15" opacity=".38"/>
          <ellipse cx="-8"  cy="30"  rx="14" ry="11" opacity=".30"/>
          <ellipse cx="52"  cy="46"  rx="11" ry="9"  opacity=".26"/>
        </g>
      </g>
    </svg>
  </div>

  <h1 class="name fade" id="name" style="animation-delay:.1s">&nbsp;</h1>
  <div class="stats fade" id="stats" style="animation-delay:.15s"></div>
  <div class="next fade" id="next" style="animation-delay:.2s"></div>
  <div class="foot fade" style="animation-delay:.25s"><button id="hemi" type="button"></button></div>

  <div id="town" aria-hidden="true"></div>

<script>
(function(){
  "use strict";
  var D = Math.PI/180, SVGNS = "http://www.w3.org/2000/svg";
  var south = null;
  var el = function(id){ return document.getElementById(id); };
  var still = !!(window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // Resolve the palette once; SVG presentation attributes get literal colours.
  var CSS = getComputedStyle(document.documentElement);
  var C = {
    back : CSS.getPropertyValue("--town-back").trim()  || "#0a0e1a",
    front: CSS.getPropertyValue("--town-front").trim() || "#04060d",
    wire : CSS.getPropertyValue("--wire").trim()       || "#161c2b",
    win  : CSS.getPropertyValue("--win").trim()        || "#e0a355"
  };

  function norm(a){ a = a % 360; return a < 0 ? a + 360 : a; }
  function rnd(a,b){ return a + Math.random()*(b-a); }

  /* ===================== moon =========================================== */

  /* Positions follow Meeus, "Astronomical Algorithms" (2nd ed): chapter 25 for
     the Sun, chapter 47 -- the abridged ELP-2000/82 -- for the Moon. That is
     good to about 10" in lunar longitude, which lands new and full moon within
     half a minute of the published times. The previous nine-term series drifted
     up to twelve minutes, which the clock times below would have hidden. */

  function sin(x){ return Math.sin(x*D); }
  function cos(x){ return Math.cos(x*D); }

  // Table 47.A -- D, M, M', F, coefficient of sum(l) in 1e-6 deg, of sum(r) in metres.
  var TL = [
    0,0,1,0,6288774,-20905355,   2,0,-1,0,1274027,-3699111,  2,0,0,0,658314,-2955968,
    0,0,2,0,213618,-569925,      0,1,0,0,-185116,48888,      0,0,0,2,-114332,-3149,
    2,0,-2,0,58793,246158,       2,-1,-1,0,57066,-152138,    2,0,1,0,53322,-170733,
    2,-1,0,0,45758,-204586,      0,1,-1,0,-40923,-129620,    1,0,0,0,-34720,108743,
    0,1,1,0,-30383,104755,       2,0,0,-2,15327,10321,       0,0,1,2,-12528,0,
    0,0,1,-2,10980,79661,        4,0,-1,0,10675,-34782,      0,0,3,0,10034,-23210,
    4,0,-2,0,8548,-21636,        2,1,-1,0,-7888,24208,       2,1,0,0,-6766,30824,
    1,0,-1,0,-5163,-8379,        1,1,0,0,4987,-16675,        2,-1,1,0,4036,-12831,
    2,0,2,0,3994,-10445,         4,0,0,0,3861,-11650,        2,0,-3,0,3665,14403,
    0,1,-2,0,-2689,-7003,        2,0,-1,2,-2602,0,           2,-1,-2,0,2390,10056,
    1,0,1,0,-2348,6322,          2,-2,0,0,2236,-9884,        0,1,2,0,-2120,5751,
    0,2,0,0,-2069,0,             2,-2,-1,0,2048,-4950,       2,0,1,-2,-1773,4130,
    2,0,0,2,-1595,0,             4,-1,-1,0,1215,-3958,       0,0,2,2,-1110,0,
    3,0,-1,0,-892,3258,          2,1,1,0,-810,2616,          4,-1,-2,0,759,-1897,
    0,2,-1,0,-713,-2117,         2,2,-1,0,-700,2354,         2,1,-2,0,691,0,
    2,-1,0,-2,596,0,             4,0,1,0,549,-1423,          0,0,4,0,537,-1117,
    4,-1,0,0,520,-1571,          1,0,-2,0,-487,-1739,        2,1,0,-2,-399,0,
    0,0,2,-2,-381,-4421,         1,1,1,0,351,0,              3,0,-2,0,-340,0,
    4,0,-3,0,330,0,              2,-1,2,0,327,0,             0,2,1,0,-323,1165,
    1,1,-1,0,299,0,              2,0,3,0,294,0,              2,0,-1,-2,0,8752
  ];

  // Table 47.B -- D, M, M', F, coefficient of sum(b) in 1e-6 deg.
  var TB = [
    0,0,0,1,5128122,  0,0,1,1,280602,   0,0,1,-1,277693,  2,0,0,-1,173237,
    2,0,-1,1,55413,   2,0,-1,-1,46271,  2,0,0,1,32573,    0,0,2,1,17198,
    2,0,1,-1,9266,    0,0,2,-1,8822,    2,-1,0,-1,8216,   2,0,-2,-1,4324,
    2,0,1,1,4200,     2,1,0,-1,-3359,   2,-1,-1,1,2463,   2,-1,0,1,2211,
    2,-1,-1,-1,2065,  0,1,-1,-1,-1870,  4,0,-1,-1,1828,   0,1,0,1,-1794,
    0,0,0,3,-1749,    0,1,-1,1,-1565,   1,0,0,1,-1491,    0,1,1,1,-1475,
    0,1,1,-1,-1410,   0,1,0,-1,-1344,   1,0,0,-1,-1335,   0,0,3,1,1107,
    4,0,0,-1,1021,    4,0,-1,1,833,     0,0,1,-3,777,     4,0,-2,1,671,
    2,0,0,-3,607,     2,0,2,-1,596,     2,-1,1,-1,491,    2,0,-2,1,-451,
    0,0,3,-1,439,     2,0,2,1,422,      2,0,-3,-1,421,    2,1,-1,1,-366,
    2,1,0,1,-351,     4,0,0,1,331,      2,-1,1,1,315,     2,-2,0,-1,302,
    0,0,1,3,-283,     2,1,1,-1,-229,    1,1,0,-1,223,     1,1,0,1,223,
    0,1,-2,-1,-220,   2,1,-1,-1,-220,   1,0,1,1,-185,     2,-1,-2,-1,181,
    0,1,2,1,-177,     4,0,-2,-1,176,    4,-1,-1,-1,166,   1,0,1,-1,-164,
    4,0,1,-1,132,     1,0,-1,-1,-119,   4,-1,0,-1,115,    2,-2,0,1,107
  ];

  // Delta T, the gap between terrestrial and universal time, in seconds
  // (Espenak & Meeus). The tables above are indexed by TT, the browser clock
  // reports UTC, and seventy-odd seconds is worth about 0.01 deg of moon.
  function deltaT(y){
    var t, u;
    if (y >= 2005 && y < 2050){ t = y - 2000; return 62.92 + 0.32217*t + 0.005589*t*t; }
    if (y >= 1986 && y < 2005){
      t = y - 2000;
      return 63.86 + 0.3345*t - 0.060374*t*t + 0.0017275*t*t*t +
             0.000651814*t*t*t*t + 0.00002373599*t*t*t*t*t;
    }
    if (y >= 2050 && y < 2150){ u = (y - 1820)/100; return -20 + 32*u*u - 0.5628*(2150 - y); }
    u = (y - 1820)/100; return -20 + 32*u*u;
  }

  // Julian centuries of TT since J2000.0, from a UTC timestamp in milliseconds.
  function centuries(ms){
    var jd = ms/86400000 + 2440587.5;
    var year = 2000 + (jd - 2451545.0)/365.25;
    return (jd + deltaT(year)/86400 - 2451545.0)/36525;
  }

  function sunPos(T){
    var L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
    var M  = 357.52911 + 35999.05029*T - 0.0001537*T*T;
    var e  = 0.016708634 - 0.000042037*T - 0.0000001267*T*T;
    var C  = (1.914602 - 0.004817*T - 0.000014*T*T)*sin(M)
           + (0.019993 - 0.000101*T)*sin(2*M)
           + 0.000289*sin(3*M);
    var v  = M + C, Om = 125.04 - 1934.136*T;
    return {
      lon: norm(L0 + C - 0.00569 - 0.00478*sin(Om)),   // apparent longitude
      R:   1.000001018*(1 - e*e)/(1 + e*cos(v))        // distance in AU
    };
  }

  function moonPos(T){
    var Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T*T + T*T*T/538841 - T*T*T*T/65194000;
    var Dm = 297.8501921 + 445267.1114034*T  - 0.0018819*T*T + T*T*T/545868 - T*T*T*T/113065000;
    var M  = 357.5291092 + 35999.0502909*T   - 0.0001536*T*T + T*T*T/24490000;
    var Mp = 134.9633964 + 477198.8675055*T  + 0.0087414*T*T + T*T*T/69699  - T*T*T*T/14712000;
    var F  = 93.2720950  + 483202.0175233*T  - 0.0036539*T*T - T*T*T/3526000 + T*T*T*T/863310000;
    var A1 = 119.75 + 131.849*T, A2 = 53.09 + 479264.290*T, A3 = 313.45 + 481266.484*T;
    var E = 1 - 0.002516*T - 0.0000074*T*T;    // damps terms involving the Sun's anomaly
    var sl = 0, sr = 0, sb = 0, i, a, f;

    for (i = 0; i < TL.length; i += 6){
      a = TL[i]*Dm + TL[i+1]*M + TL[i+2]*Mp + TL[i+3]*F;
      f = Math.abs(TL[i+1]) === 1 ? E : (Math.abs(TL[i+1]) === 2 ? E*E : 1);
      sl += TL[i+4]*f*sin(a);
      sr += TL[i+5]*f*cos(a);
    }
    for (i = 0; i < TB.length; i += 5){
      a = TB[i]*Dm + TB[i+1]*M + TB[i+2]*Mp + TB[i+3]*F;
      f = Math.abs(TB[i+1]) === 1 ? E : (Math.abs(TB[i+1]) === 2 ? E*E : 1);
      sb += TB[i+4]*f*sin(a);
    }
    sl += 3958*sin(A1) + 1962*sin(Lp - F) + 318*sin(A2);
    sb += -2235*sin(Lp) + 382*sin(A3) + 175*sin(A1 - F) + 175*sin(A1 + F)
        + 127*sin(Lp - Mp) - 115*sin(Lp + Mp);

    return { lon: norm(Lp + sl/1e6), lat: sb/1e6, dist: 385000.56 + sr/1000 };
  }

  // Difference in apparent ecliptic longitude. This is the quantity the four
  // named phases are defined on, so it drives the naming and the geometry.
  function elongation(ms){
    var T = centuries(ms);
    return norm(moonPos(T).lon - sunPos(T).lon);
  }

  var AU = 149597870.7;

  function state(ms){
    var T = centuries(ms), s = sunPos(T), m = moonPos(T);
    var psi = norm(m.lon - s.lon);
    // The true separation, which the moon's ecliptic latitude tilts away from
    // the longitude difference by up to five degrees.
    var sep = Math.acos(cos(m.lat)*cos(m.lon - s.lon))/D;
    // Illumination depends on the Sun-Moon-Earth angle, not on the separation
    // seen from here; at 400 000 km the two differ by up to a sixth of a degree.
    var Rk = s.R*AU;
    var i = Math.atan2(Rk*sin(sep), m.dist - Rk*cos(sep))/D;
    return { psi:psi, lit:(1 + cos(i))/2, dist:m.dist, waxing:psi < 180 };
  }

  function phaseName(psi){
    var W = 6;
    if (psi < W || psi > 360-W) return "New moon";
    if (Math.abs(psi - 90)  < W) return "First quarter";
    if (Math.abs(psi - 180) < W) return "Full moon";
    if (Math.abs(psi - 270) < W) return "Last quarter";
    if (psi < 90)  return "Waxing crescent";
    if (psi < 180) return "Waxing gibbous";
    if (psi < 270) return "Waning gibbous";
    return "Waning crescent";
  }

  // Walk hour by hour until the wrapped elongation crosses the target, then
  // bisect. Stepping backwards (dir -1) finds the most recent crossing, which
  // is how the moon's real age is measured. The 180 deg branch cut only ever
  // jumps the wrong way, so it is never mistaken for a crossing.
  function crossing(fromMs, target, dir){
    var f = function(t){
      var x = elongation(t) - target;
      while (x < -180) x += 360;
      while (x >  180) x -= 360;
      return x;
    };
    var step = dir*3600000, t0 = fromMs, prev = f(t0), i, t1, cur, lo, hi, mid, j;
    for (i = 1; i <= 24*32; i++){
      t1 = fromMs + i*step; cur = f(t1);
      if (dir > 0 ? (prev < 0 && cur >= 0) : (prev >= 0 && cur < 0)){
        lo = Math.min(t0,t1); hi = Math.max(t0,t1);
        for (j = 0; j < 42; j++){ mid = (lo+hi)/2; if (f(mid) < 0) lo = mid; else hi = mid; }
        return (lo+hi)/2;
      }
      t0 = t1; prev = cur;
    }
    return null;
  }

  // Root finding costs a few hundred series evaluations, so hold the answers
  // until the event they describe has actually gone past.
  var events = null;
  function moonEvents(now, psi){
    if (events && events.last !== null && events.next !== null &&
        now >= events.last && now < events.next) return events;
    var target = psi < 180 ? 180 : 0;
    events = {
      last: crossing(now, 0, -1),          // previous new moon
      next: crossing(now, target, 1),
      nextIsFull: target === 180
    };
    return events;
  }

  function litPath(k, waxing, R){
    if (k >= 0.999) return "M0,-"+R+" A"+R+","+R+" 0 1 1 0,"+R+" A"+R+","+R+" 0 1 1 0,-"+R+" Z";
    if (k <= 0.001) return "";
    var rx = R * Math.abs(1 - 2*k);
    var limbSweep = waxing ? 1 : 0;
    var termSweep = (k < 0.5) ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
    return "M0,-"+R+" A"+R+","+R+" 0 0 "+limbSweep+" 0,"+R+
           " A"+rx.toFixed(3)+","+R+" 0 0 "+termSweep+" 0,-"+R+" Z";
  }

  function fmtDate(d){
    return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  }
  // Within a day, give the actual clock time -- a rounded countdown hides
  // precision the calculation already has. Beyond that, days are enough.
  function inDays(ms, now){
    var d = (ms - now)/86400000;
    if (d < 1){
      var t = new Date(ms);
      var when = t.toDateString() === new Date(now).toDateString() ? "today" : "tomorrow";
      return when + " at " + t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    }
    var n = Math.round(d);
    return "in " + n + (n === 1 ? " day" : " days");
  }

  // Round to a whole percent, but never let rounding claim a full or new moon
  // that has not happened -- a 99.6% gibbous is not "100% lit".
  function pct(k){
    var v = k*100;
    if (v >= 99.95) return 100;
    if (v <= 0.05)  return 0;
    return Math.max(1, Math.min(99, Math.round(v)));
  }

  function render(){
    var now = new Date(), ms = now.getTime();
    var s = state(ms), psi = s.psi, R = 100;
    var d = litPath(s.lit, s.waxing, R);
    el("lit").setAttribute("d", d);
    el("clipPath").setAttribute("d", d);
    el("disc").setAttribute("transform", south ? "rotate(180)" : "");
    el("halo").setAttribute("opacity", (0.15 + 0.85*s.lit).toFixed(3));

    var ev = moonEvents(ms, psi);
    var age = ev.last !== null ? (ms - ev.last)/86400000 : psi/360*29.530588853;

    el("date").textContent  = fmtDate(now);
    el("name").textContent  = phaseName(psi);
    el("stats").textContent = pct(s.lit) + "% lit \u00B7 " + age.toFixed(1) + " days old";

    el("next").textContent = ev.next !== null
      ? (ev.nextIsFull ? "Full moon " : "New moon ") + inDays(ev.next, ms)
      : "";

    el("hemi").textContent = (south ? "Southern" : "Northern") + " hemisphere view";
  }

  /* ===================== stars ========================================== */

  function stars(){
    var sky = el("sky");
    var vw = window.innerWidth, vh = window.innerHeight;
    // Layout offsets, not the client rect: on first paint the intro fade is
    // still translating the moon, and pivoting the sky about that transient
    // position leaves the wheel a few pixels off centre.
    var wrap = document.querySelector(".moon-wrap");
    var cx = wrap.offsetLeft + wrap.offsetWidth/2;
    var cy = wrap.offsetTop  + wrap.offsetHeight/2;

    // The field wheels about the moon, so sizing it off the viewport left bare
    // corners swinging through view. Fit it to the farthest screen corner
    // instead: the inscribed circle then covers the screen at any rotation.
    var R = 0;
    [[0,0],[vw,0],[0,vh],[vw,vh]].forEach(function(p){
      R = Math.max(R, Math.hypot(p[0]-cx, p[1]-cy));
    });
    R = Math.ceil(R) + 2;
    var S = 2*R;

    sky.style.left = (cx - R) + "px";
    sky.style.top  = (cy - R) + "px";
    sky.style.width = sky.style.height = S + "px";
    sky.style.transformOrigin = "50% 50%";
    sky.textContent = "";

    var clear = (wrap.offsetWidth * 100/256) * 1.5;
    var n = Math.round(Math.min(1200, Math.max(300, S*S/2475)));
    var frag = document.createDocumentFragment(), guard = 0;

    for (var i = 0; i < n; i++){
      var x = Math.random()*S, y = Math.random()*S;
      if (Math.hypot(x-R, y-R) < clear && guard++ < n*4){ i--; continue; }
      var big = Math.random();
      var size = big > 0.95 ? 2.6 : big > 0.74 ? 1.8 : 1.2;
      var st = document.createElement("span");
      st.className = big > 0.95 ? "star lg" : "star";
      st.style.left = x.toFixed(1) + "px";
      st.style.top  = y.toFixed(1) + "px";
      st.style.width = st.style.height = size + "px";
      st.style.setProperty("--o", (0.34 + Math.random()*0.62).toFixed(2));
      st.style.setProperty("--dur", (3.5 + Math.random()*7).toFixed(1) + "s");
      st.style.setProperty("--delay", (-Math.random()*10).toFixed(1) + "s");
      frag.appendChild(st);
    }
    sky.appendChild(frag);
  }

  /* ===================== town =========================================== */

  // Heights and widths are in units of 1/100 of the band height, so buildings
  // keep their proportions at every screen size. Only the gaps between them
  // stretch, and the gaps widen toward the right so the mass sits left of centre.
  var SPEC = [
    {w:26, h:34, t:"flat",  c:3, r:2},
    {w:18, h:47, t:"pitch", c:2, r:3},
    {w:34, h:27, t:"flat",  c:4, r:2},
    {w:11, h:74, t:"pine"},
    {w:22, h:41, t:"pitch", c:3, r:2},
    {w:16, h:86, t:"spire", c:1, r:4},
    {w:14, h:30, t:"flat",  c:2, r:2},
    {w:30, h:53, t:"flat",  c:4, r:3},
    {w:20, h:36, t:"pitch", c:2, r:2},
    {w:19, h:60, t:"tower"},
    {w:28, h:31, t:"flat",  c:3, r:2},
    {w:9,  h:66, t:"pine"},
    {w:24, h:44, t:"pitch", c:3, r:3},
    {w:36, h:25, t:"flat",  c:5, r:1}
  ];

  var wins = [];

  function mk(tag, attrs){
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function pinePath(cx, base, w, h){
    var tiers = 7, pts = [], i, t, hw, y;
    for (i = 0; i <= tiers; i++){
      t = i/tiers;
      y = base - h + h*0.92*t;
      hw = (w/2) * Math.pow(t, 0.82);
      pts.push([cx + hw, y]);
      if (i < tiers) pts.push([cx + hw*0.52, y + (h*0.92/tiers)*0.45]);
    }
    var right = pts.map(function(p){ return p[0].toFixed(1)+","+p[1].toFixed(1); });
    var left  = pts.slice().reverse().map(function(p){
      return (2*cx - p[0]).toFixed(1)+","+p[1].toFixed(1);
    });
    return "M"+cx.toFixed(1)+","+(base-h).toFixed(1)+" L"+right.join(" L")+
           " L"+(cx + w*0.06).toFixed(1)+","+base+
           " L"+(cx - w*0.06).toFixed(1)+","+base+
           " L"+left.join(" L")+" Z";
  }

  function building(g, spec, x, base, u, fill, withWindows){
    var w = spec.w*u, h = spec.h*u;

    if (spec.t === "pine"){
      g.appendChild(mk("path", {d:pinePath(x + w/2, base, w, h), fill:fill}));
      return w;
    }

    if (spec.t === "tower"){
      var legW = Math.max(1, u*1.1), tankH = h*0.34, tankY = base - h;
      g.appendChild(mk("path", {
        d:"M"+(x+w*0.18)+","+base+" L"+(x+w*0.38)+","+(tankY+tankH)+
          " L"+(x+w*0.44)+","+(tankY+tankH)+" L"+(x+w*0.26)+","+base+" Z", fill:fill}));
      g.appendChild(mk("path", {
        d:"M"+(x+w*0.82)+","+base+" L"+(x+w*0.62)+","+(tankY+tankH)+
          " L"+(x+w*0.56)+","+(tankY+tankH)+" L"+(x+w*0.74)+","+base+" Z", fill:fill}));
      g.appendChild(mk("rect", {x:x+w*0.3, y:tankY+tankH*0.55, width:w*0.4, height:h*0.5, fill:fill}));
      g.appendChild(mk("rect", {x:x+w*0.08, y:tankY+tankH*0.28, width:w*0.84, height:tankH*0.8,
                                rx:legW, fill:fill}));
      g.appendChild(mk("path", {
        d:"M"+(x+w*0.06)+","+(tankY+tankH*0.3)+" L"+(x+w/2)+","+tankY+
          " L"+(x+w*0.94)+","+(tankY+tankH*0.3)+" Z", fill:fill}));
      return w;
    }

    var bodyTop = base - h;
    if (spec.t === "pitch"){
      var roof = h*0.26;
      bodyTop = base - h + roof;
      g.appendChild(mk("path", {
        d:"M"+(x - u*1.2)+","+bodyTop+" L"+(x + w/2)+","+(base-h)+
          " L"+(x + w + u*1.2)+","+bodyTop+" Z", fill:fill}));
    }
    if (spec.t === "spire"){
      var sp = h*0.42;
      bodyTop = base - h + sp;
      g.appendChild(mk("path", {
        d:"M"+(x - u*0.8)+","+bodyTop+" L"+(x + w/2)+","+(base-h+u*3)+
          " L"+(x + w + u*0.8)+","+bodyTop+" Z", fill:fill}));
      // finial: must run down past the apex (base-h+u*3) or it floats free
      g.appendChild(mk("rect", {x:x + w/2 - Math.max(0.6,u*0.22), y:base-h-u*3.5,
                                width:Math.max(1.1,u*0.44), height:u*8, fill:fill}));
    }
    g.appendChild(mk("rect", {x:x, y:bodyTop, width:w, height:base-bodyTop, fill:fill}));

    if (withWindows && spec.c){
      var cols = spec.c, rows = spec.r;
      var ww = Math.max(2, u*2.1), wh = Math.max(2.5, u*2.8);
      var availH = base - bodyTop;
      var padX = (w - cols*ww)/(cols+1);
      var padY = (availH - rows*wh)/(rows+1);
      if (padX > 0.5 && padY > 0.5){
        for (var r = 0; r < rows; r++){
          for (var c = 0; c < cols; c++){
            var el2 = mk("rect", {
              x:(x + padX + c*(ww+padX)).toFixed(1),
              y:(bodyTop + padY + r*(wh+padY)).toFixed(1),
              width:ww.toFixed(1), height:wh.toFixed(1), fill:C.win, opacity:0
            });
            el2.setAttribute("class","win");
            el2.dataset.lit = rnd(0.5, 0.95).toFixed(2);
            el2.dataset.on = "0";
            g.appendChild(el2);
            wins.push(el2);
          }
        }
      }
    }
    return w;
  }

  function row(g, width, base, u, startIdx, gapBase, fill, scale, withWindows){
    var x = -u*8, i = startIdx, guard = 0;
    while (x < width + u*10 && guard++ < 200){
      var spec = SPEC[i % SPEC.length];
      var s = {w:spec.w, h:spec.h*scale, t:spec.t, c:spec.c, r:spec.r};
      var adv = building(g, s, x, base, u, fill, withWindows);
      var spread = 1 + 1.7*Math.max(0, Math.min(1, x/width));   // thins out to the right
      x += adv + u*gapBase*spread;
      i++;
    }
  }

  function powerLine(g, width, base, u){
    var poleH = u*46, poleW = Math.max(1.2, u*0.9);
    var xs = [-width*0.05, width*0.27, width*0.79, width*1.05];
    var top = base - poleH;
    var d = "M"+xs[0]+","+top;
    for (var i = 1; i < xs.length; i++){
      var mid = (xs[i-1]+xs[i])/2;
      d += " Q"+mid+","+(top + (xs[i]-xs[i-1])*0.10)+" "+xs[i]+","+top;
    }
    g.appendChild(mk("path", {d:d, fill:"none", stroke:C.wire,
                              "stroke-width":Math.max(1, u*0.42)}));
    for (var j = 1; j < xs.length-1; j++){
      g.appendChild(mk("rect", {x:xs[j]-poleW/2, y:top, width:poleW, height:poleH,
                                fill:C.front}));
      g.appendChild(mk("rect", {x:xs[j]-u*3, y:top+u*2.5, width:u*6, height:Math.max(1,u*0.7),
                                fill:C.front}));
    }
  }

  function town(){
    var host = el("town");
    var width = host.clientWidth, H = host.clientHeight;
    if (!width || !H) return;
    var u = H/100, base = H;
    wins = [];

    var svg = mk("svg", {viewBox:"0 0 "+width+" "+H, width:"100%", height:"100%"});

    var back = mk("g", {}); svg.appendChild(back);
    row(back, width, base, u, 7, 9, C.back, 0.62, false);

    var front = mk("g", {}); svg.appendChild(front);
    row(front, width, base, u, 0, 5, C.front, 1, true);

    powerLine(svg, width, base, u);

    host.textContent = "";
    host.appendChild(svg);
    seedLights();
  }

  /* --- window lights: how many are on tracks the actual hour ------------- */

  var CURVE = [.30,.20,.13,.09,.07,.10,.20,.30,.28,.18,.12,.10,
               .10,.10,.10,.12,.18,.35,.60,.75,.80,.78,.65,.45];

  function litRatio(){
    var n = new Date(), h = n.getHours() + n.getMinutes()/60;
    var a = CURVE[Math.floor(h) % 24], b = CURVE[(Math.floor(h)+1) % 24];
    return a + (b-a)*(h % 1);
  }

  function setWin(w, on){
    w.dataset.on = on ? "1" : "0";
    w.style.opacity = on ? w.dataset.lit : 0;
  }

  function seedLights(){
    var want = litRatio();
    wins.forEach(function(w){ setWin(w, Math.random() < want); });
  }

  function flicker(){
    if (!wins.length) return;
    var lit = 0;
    wins.forEach(function(w){ if (w.dataset.on === "1") lit++; });
    var want = litRatio() * wins.length;
    // drift toward the target, but never in a way that reads as a sweep
    var off = lit > want ? Math.random() < 0.85 : Math.random() < 0.15;
    var pool = wins.filter(function(w){ return (w.dataset.on === "1") === off; });
    if (pool.length) setWin(pool[Math.floor(Math.random()*pool.length)], !off);
    setTimeout(flicker, rnd(5000, 12000));
  }

  /* ===================== wiring ========================================= */

  function save(v){ try{ localStorage.setItem("moon.south", v ? "1":"0"); }catch(e){} }
  function load(){ try{ return localStorage.getItem("moon.south"); }catch(e){ return null; } }

  var stored = load();
  south = stored !== null ? stored === "1" : false;

  el("hemi").addEventListener("click", function(){ south = !south; save(south); render(); });

  if (stored === null && navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      south = pos.coords.latitude < 0; save(south); render();
    }, function(){}, {timeout:8000, maximumAge:86400000});
  }

  var t;
  window.addEventListener("resize", function(){
    clearTimeout(t);
    t = setTimeout(function(){ stars(); town(); }, 250);
  });

  render();
  stars();
  town();
  if (!still) setTimeout(flicker, rnd(3000, 7000));
  setInterval(render, 60000);
  setInterval(seedLights, 30*60000);          // re-seat the lit ratio each half hour
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden){ render(); seedLights(); }
  });

  /* installable manifest, generated in-page so this stays one file */
  try {
    var cv = document.createElement("canvas");
    cv.width = cv.height = 512;
    var g2 = cv.getContext("2d");
    g2.fillStyle = "#0f1320"; g2.fillRect(0,0,512,512);
    g2.beginPath(); g2.arc(256,256,168,0,Math.PI*2); g2.fillStyle = "#f2ece0"; g2.fill();
    g2.beginPath(); g2.arc(316,216,150,0,Math.PI*2); g2.fillStyle = "#0f1320"; g2.fill();
    var icon = cv.toDataURL("image/png");
    var here = location.href.split(/[?#]/)[0];
    var dir  = here.replace(/[^\/]*$/, "");
    var mf = {
      id: here,
      name:"Moon", short_name:"Moon",
      start_url: here, scope: dir,
      display:"standalone", orientation:"portrait",
      background_color:"#0f1320", theme_color:"#0f1320",
      icons:[
        {src:icon, sizes:"512x512", type:"image/png", purpose:"any"},
        {src:icon, sizes:"512x512", type:"image/png", purpose:"maskable"}
      ]
    };
    el("manifest").href = URL.createObjectURL(
      new Blob([JSON.stringify(mf)], {type:"application/manifest+json"})
    );
    // iOS reads this rather than the manifest when adding to the home screen.
    var touch = document.createElement("link");
    touch.rel = "apple-touch-icon";
    touch.href = icon;
    document.head.appendChild(touch);
  } catch(e){}
})();
</script>
</body>
</html>
